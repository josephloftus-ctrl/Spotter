name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: List available simulators
      run: |
        xcrun simctl list devices available
        xcrun simctl list runtimes

    - name: Create iOS 26 simulator if needed
      run: |
        # Check if iOS 26 runtime exists
        if xcrun simctl list runtimes | grep -q "iOS 26"; then
          echo "iOS 26 runtime found"
          # Create iPhone 16 Pro simulator if it doesn't exist
          if ! xcrun simctl list devices | grep -q "iPhone 16 Pro.*iOS 26"; then
            RUNTIME_ID=$(xcrun simctl list runtimes | grep "iOS 26" | head -1 | awk -F'[()]' '{print $2}' | awk '{print $NF}')
            echo "Creating iPhone 16 Pro with runtime: $RUNTIME_ID"
            xcrun simctl create "iPhone 16 Pro" "iPhone 16 Pro" "$RUNTIME_ID" || true
          fi
        else
          echo "iOS 26 runtime not found, will use generic destination"
        fi
        xcrun simctl list devices available

    - name: Build for iOS Simulator
      run: |
        set -o pipefail
        # Try to find an available iOS 26 simulator, fall back to generic
        if xcrun simctl list devices available | grep -q "iPhone.*Booted\|iPhone 16 Pro"; then
          DESTINATION='platform=iOS Simulator,name=iPhone 16 Pro'
        else
          DESTINATION='generic/platform=iOS Simulator'
        fi
        echo "Using destination: $DESTINATION"
        xcodebuild clean build \
          -project Spotter.xcodeproj \
          -scheme Spotter \
          -destination "$DESTINATION" \
          -configuration Debug \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          2>&1 | tee build.log

    - name: Show build errors
      if: failure()
      run: |
        echo "=== BUILD ERRORS ==="
        grep -E "error:|warning:" build.log || echo "No errors found in grep"
        echo "=== END ERRORS ==="

    - name: Build Archive (Unsigned)
      run: |
        xcodebuild archive \
          -project Spotter.xcodeproj \
          -scheme Spotter \
          -archivePath build/Spotter.xcarchive \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Create Unsigned IPA
      run: |
        mkdir -p build/Payload
        cp -r build/Spotter.xcarchive/Products/Applications/Spotter.app build/Payload/
        cd build
        zip -r Spotter-unsigned.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Spotter-unsigned-ipa
        path: build/Spotter-unsigned.ipa
        retention-days: 30

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: Spotter-xcarchive
        path: build/Spotter.xcarchive
        retention-days: 30
